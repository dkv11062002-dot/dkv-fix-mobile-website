<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DKV Fix Owner Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #111827, #1d4ed8, #7c3aed);
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
            text-align: center;
        }

        .logo {
            font-size: 34px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #2563eb, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #64748b;
            margin: 8px 0 28px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #2563eb, #7c3aed);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #message {
            margin-top: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">
            DKV FIX
        </div>

        <p class="subtitle">
            🔐 Owner Login
        </p>

        <input
            type="text"
            id="username"
            placeholder="Username"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <button onclick="login()">
            Login
        </button>

        <div id="message"></div>

    </div>


    <script>

        function login() {

            const username =
                document.getElementById("username").value;

            const password =
                document.getElementById("password").value;

            /*
             * DEMO LOGIN ONLY
             * We will replace this with a secure
             * backend login later.
             */

            if (
                username === "dkvfix" &&
                password === "123456"
            ) {

                document.getElementById("message").style.color =
                    "#16a34a";

                document.getElementById("message").innerText =
                    "Login successful!";

            } else {

                document.getElementById("message").style.color =
                    "#dc2626";

                document.getElementById("message").innerText =
                    "Invalid username or password.";

            }
        }

    </script>

</body>
</html>
